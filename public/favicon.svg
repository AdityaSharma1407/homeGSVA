<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#0F2440" />
    </linearGradient>
    <linearGradient id="hc-roof" x1="12" y1="14" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E35D33" />
      <stop offset="100%" stop-color="#C84B24" />
    </linearGradient>
  </defs>
  <!-- Squircle container -->
  <rect width="64" height="64" rx="15" fill="url(#hc-bg)" />
  <!-- Architectural blueprint grid lines (subtle) -->
  <path d="M16 14V50M32 14V50M48 14V50M14 32H50M14 44H50" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
  <!-- House roof / drafting triangle -->
  <path d="M13 31L32 14.5L51 31" stroke="url(#hc-roof)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- House body + precision caliper/ruler base -->
  <path d="M19 31.5V47.5H45V31.5" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Ruler tick marks inside architectural frame -->
  <path d="M26 47.5V42.5M32 47.5V40M38 47.5V42.5" stroke="#F59E7A" stroke-width="2.4" stroke-linecap="round" />
  <!-- Center precision node -->
  <circle cx="32" cy="27" r="2.6" fill="#FFFFFF" />
</svg>
